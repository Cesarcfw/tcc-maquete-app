name: Relatar defeito
description: Registrar falha reproduzível com dados fictícios
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Não envie senha, token, banco ou dados pessoais. Para vulnerabilidade, consulte SECURITY.md e use canal privado."
  - type: input
    id: version
    attributes:
      label: Versão, commit e build
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Web, Expo Go ou APK; aparelho/Android ou navegador; backend/Node-RED e origem virtual/física.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Preparação e passos para reproduzir
      description: Use conta e dados fictícios; informe concessões, quarto e cenário sem credenciais.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado esperado e observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências e impacto
      description: Prints/logs sem segredos; informar frequência e se há alternativa de uso.
