name: Validar aplicativo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:web
      - run: npm test
        working-directory: backend
