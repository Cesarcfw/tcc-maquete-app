<script type="text/html" data-help-name="samahi-physical-gateway">
  <p>
    Recebe UDP do ESP; envia comandos pela saida ao UDP out existente (origem
    4210/destino 4211). Somente ACK correlacionado confirma alteracoes.
    Source/device/porta/IP/pinos/acao/valor sao conferidos.
  </p>
  <p>
    Disponibiliza samahiPhysical no contexto global para as rotas HTTP da API
    fisica. Nao ativa sensores simulados. Agenda Dia/Noite depende deste
    processo ligado e usa ACK real.
  </p>
  <p>
    Reconhecer gas e uma acao do app; nao silencia nem desliga a sinalizacao
    local do ESP. O acesso HTTP deve permanecer local, atras do backend
    autenticado.
  </p>
</script>
